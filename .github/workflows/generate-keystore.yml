name: Generate signing key (run once)

# Run this ONCE from the Actions tab, download the artifact, copy the four
# values into repository secrets, then DELETE the artifact (and the run).
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create keystore
        run: |
          set -e
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -v -keystore nizam-release.jks -storetype PKCS12 \
            -keyalg RSA -keysize 4096 -validity 36500 -alias nizam \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Nizam, O=Personal, C=IN"
          {
            echo "Add these as Repository secrets (Settings > Secrets and variables > Actions > New repository secret)."
            echo "Then delete this artifact and this workflow run. Keep a private copy somewhere safe:"
            echo "if you lose the key you must uninstall Nizam (losing local data) to install a new build."
            echo
            echo "NIZAM_KEY_ALIAS"
            echo "nizam"
            echo
            echo "NIZAM_STORE_PASSWORD"
            echo "$PASS"
            echo
            echo "NIZAM_KEY_PASSWORD"
            echo "$PASS"
            echo
            echo "NIZAM_KEYSTORE_B64"
            base64 -w0 nizam-release.jks
            echo
            echo
            echo "(Not a secret) SHA-1 for the Google Cloud Android OAuth client:"
            keytool -list -v -keystore nizam-release.jks -storepass "$PASS" | grep -E "SHA1:" 
          } > nizam-signing-secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nizam-signing-secrets-DELETE-AFTER-USE
          path: nizam-signing-secrets.txt
          retention-days: 1
