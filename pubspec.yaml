name: nizam
description: "Nizam - personal life OS"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  drift: ">=2.28.0 <2.29.0"
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.1
  timezone: ^0.10.1
  adhan: ^2.0.0+1
  flutter_local_notifications: ^20.1.0
  permission_handler: ^12.0.1
  android_intent_plus: ^6.1.0
  quick_actions: ^1.1.0
  flutter_secure_storage: ^10.3.4
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  intl: ^0.20.3
  google_sign_in: ^7.2.0
  googleapis: ^19.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  workmanager: ^0.9.2
  share_plus: ^12.0.2
  pdf: ^3.12.0
  googleapis_auth: ^2.0.0
  sqlite3: ^2.9.4
  image: ">=4.5.0 <4.6.0"
  http: ^1.6.0
  url_launcher: ^6.3.2
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  drift_dev: ">=2.28.0 <2.29.0"
  build_runner: ^2.7.1

flutter:
  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-500.ttf
          weight: 500
        - asset: assets/fonts/Sora-600.ttf
          weight: 600
        - asset: assets/fonts/Sora-700.ttf
          weight: 700
        - asset: assets/fonts/Sora-800.ttf
          weight: 800
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
          weight: 400
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-600.ttf
          weight: 600

# workmanager's federated packages drifted apart; keep them on one compatible set
# for Flutter 3.35 (newer apple/platform_interface releases need Flutter 3.38).
dependency_overrides:
  workmanager_platform_interface: 0.9.3
  workmanager_android: 0.9.2
  workmanager_apple: 0.9.4
